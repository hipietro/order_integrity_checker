name: Quality checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce core coverage threshold
        run: python -m coverage report

  gui-screenshot-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Tkinter and virtual display tools
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Capture real GUI in virtual display
        run: >-
          xvfb-run -a python capture_gui_screenshot.py
          --output /tmp/gui-main-window.png
          --manifest /tmp/gui-main-window.json
          --delay-ms 1200

      - name: Verify screenshot provenance pair
        run: >-
          python verify_gui_screenshot.py
          /tmp/gui-main-window.png
          /tmp/gui-main-window.json

      - name: Upload GUI screenshot and provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-main-window
          path: |
            /tmp/gui-main-window.png
            /tmp/gui-main-window.json
          if-no-files-found: error
